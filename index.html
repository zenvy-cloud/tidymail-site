<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidymail</title>
<meta name="description" content="Tidymail: review and clear junk from your Gmail inbox, on your phone only.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #fafaf8; --text: #1d2321; --muted: #5b6662; --accent: #0b6e6e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141917; --text: #e6ebe9; --muted: #9aa6a1; --accent: #4fc6a8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 3.5rem 1rem; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 2rem; margin: 1rem 0 .25rem; }
  p { color: var(--muted); }
  ul { text-align: left; display: inline-block; margin: 1rem 0 1.5rem; padding-left: 1.25rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Tidymail icon">
  <h1>Tidymail</h1>
  <p>Review and clear junk from your Gmail inbox.</p>
  <ul>
    <li>Reads email headers only, never message bodies</li>
    <li>Nothing moves until you review it, and it never permanently deletes</li>
    <li>Your data stays on your phone, encrypted</li>
    <li>Warns about likely phishing</li>
  </ul>
  <p><a href="privacy.html">Privacy policy</a> · <a href="mailto:financebuddypro@gmail.com">Contact</a></p>
</main>
</body>
</html>
